{% extends 'bookings/base.html' %}

{% block content %}
<section class="page-center auth-page">
  <article class="card auth-card">
    <h2>Register</h2>
    <p class="auth-description">Create your account to book your next journey with ease.</p>
    <form id="registerForm" class="form-card" action="#" onsubmit="return false;">
      <label>
        Username
        <input type="text" name="username" required />
      </label>
      <label>
        Email
        <input type="email" name="email" required />
      </label>
      <label>
        Password
        <input type="password" name="password" required />
      </label>
      <button type="submit" class="secondary-button">Create Account</button>
    </form>
    <p class="auth-footer">Already registered? <a href="{% url 'login' %}">Login</a>.</p>
  </article>
</section>
{% endblock %}
